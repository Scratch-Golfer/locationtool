<html lang="en">
<head>
<meta charset="UTF-8">

<title>Scratch Golf — London Heatmap</title>
<style>
:root{--green-deep:#1C3A0E;--green:#2D5016;--green-mid:#3B6D11;--green-light:#EAF0E2;--cream:#F6F3EC;--ink:#1A1A18;--mid:#6B6B63;--rule:#DDD8CC;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',sans-serif;background:#111;color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background:var(--green-deep);height:48px;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:10;}
.logo{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:white;}
.hdiv{width:1px;height:18px;background:rgba(255,255,255,.2);}
.htitle{font-size:12px;color:rgba(255,255,255,.6);flex:1;}
.shell{flex:1;position:relative;overflow:hidden;}
#map{position:absolute;inset:0;z-index:1;}

/* Legend */
.legend{
  position:absolute;bottom:24px;left:16px;z-index:10;
  background:rgba(255,255,255,.95);border-radius:10px;
  padding:12px 14px;box-shadow:0 2px 12px rgba(0,0,0,.2);
  min-width:160px;
}
.leg-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:8px;}
.leg-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;color:var(--ink);}
.leg-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
.leg-row:last-child{margin-bottom:0;}

/* Info panel */
.info-panel{
  position:absolute;top:12px;right:12px;z-index:10;
  background:rgba(255,255,255,.97);border-radius:10px;
  padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.2);
  width:220px;display:none;
}
.info-panel.visible{display:block;}
.info-close{position:absolute;top:8px;right:10px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--mid);}
.info-score{font-size:28px;font-weight:700;line-height:1;margin-bottom:2px;}
.info-name{font-size:14px;font-weight:600;margin-bottom:4px;}
.info-pc{font-size:11px;color:var(--mid);margin-bottom:10px;}
.info-row{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid #f0f0ec;}
.info-row:last-child{border-bottom:none;}
.info-lbl{color:var(--mid);}
.info-val{font-weight:600;}

/* Filter buttons */
.filters{
  position:absolute;top:12px;left:16px;z-index:10;
  display:flex;gap:6px;flex-wrap:wrap;
}
.fbtn{
  background:rgba(255,255,255,.9);border:none;border-radius:20px;
  padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;
  color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15);
  transition:all .15s;
}
.fbtn.on{background:var(--green-deep);color:white;}
.fbtn:hover{background:var(--green-light);}
.fbtn.on:hover{background:var(--green);}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header>
  <span class="logo">Scratch Golf</span>

  <span class="htitle">London Macro Score Heatmap</span>
</header>
<div class="shell">
  <div id="map"></div>

  <div class="filters" id="filters">
    <button class="fbtn on" onclick="setFilter(0,this)">All</button>

    </div>
  </div>

  <div class="info-panel" id="info-panel">
    <button class="info-close" onclick="closeInfo()">×</button>

    <div class="info-name" id="ip-name"></div>

  </div>
</div>

    const icon=L.divIcon({
      className:'',
      html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${col};opacity:${op};border:2px solid rgba(255,255,255,0.6);box-shadow:0 2px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:${sz>=44?14:sz>=36?12:10}px;font-family:'Helvetica Neue',sans-serif">${d.score}</div>`,
      iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]
    });
    const m=L.marker([d.lat,d.lng],{icon,zIndexOffset:d.score*100}).addTo(map);
    m.on('click',()=>showInfo(d));
    allMarkers.push(m);
  });
}

function showInfo(d){
  const col=SCORE_COLOURS[d.score];
  document.getElementById('ip-score').textContent=d.score+'/5';
  document.getElementById('ip-score').style.color=col;
  document.getElementById('ip-name').textContent=d.name;
  document.getElementById('ip-pc').textContent=d.pc+' · '+SCORE_LABELS[d.score];
  document.getElementById('ip-prof').textContent=d.prof.toFixed(0)+'%  (bench 66%)';
  document.getElementById('ip-age').textContent=d.age30.toFixed(0)+'%  (bench 40%)';
  document.getElementById('ip-dep').textContent=d.dep+'/10  (bench 4)';
  document.getElementById('ip-srent').textContent=d.s_rent.toFixed(1)+'%  (bench 4.25%)';
  document.getElementById('info-panel').classList.add('visible');
}

function closeInfo(){
  document.getElementById('info-panel').classList.remove('visible');
}

function setFilter(min, btn){
  filterMin=min;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  buildMarkers();
}

// Live sites
LIVE.forEach(s=>{
  const icon=L.divIcon({className:'',
    html:`<div style="width:16px;height:16px;border-radius:50%;background:#1C3A0E;border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,
    iconSize:[16,16],iconAnchor:[8,8]});
  L.marker([s.lat,s.lng],{icon,zIndexOffset:1000}).addTo(map)
    .bindPopup(`<div style="font-family:'Helvetica Neue',sans-serif"><strong>${s.name}</strong></div>`);
});

PIPE.forEach(s=>{
  const icon=L.divIcon({className:'',
    html:`<div style="width:13px;height:13px;border-radius:50%;background:#4A90D9;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,
    iconSize:[13,13],iconAnchor:[6.5,6.5]});
  L.marker([s.lat,s.lng],{icon,zIndexOffset:900}).addTo(map)
    .bindPopup(`<div style="font-family:'Helvetica Neue',sans-serif"><strong>${s.name}</strong></div>`);
});

buildMarkers();
</script>
