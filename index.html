<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Golf — Location Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --green-deep:#1C3A0E; --green:#2D5016; --green-mid:#3B6D11; --green-light:#EAF0E2;
  --cream:#F6F3EC; --paper:#FDFCF9; --ink:#1A1A18; --mid:#6B6B63; --rule:#DDD8CC;
  --amber:#C47B0A; --red:#B83232; --blue:#1A4A8A;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Georgia',serif;background:var(--cream);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* NAV */
nav{background:var(--green-deep);height:48px;display:flex;align-items:center;padding:0 20px;gap:0;flex-shrink:0;border-bottom:2px solid var(--green-mid);}
.nav-logo{font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:white;margin-right:20px;}
.nav-div{width:1px;height:18px;background:rgba(255,255,255,.2);margin:0 4px;}
.nav-link{display:flex;align-items:center;height:48px;padding:0 14px;font-family:'Helvetica Neue',sans-serif;font-size:11px;font-weight:500;color:rgba(255,255,255,.55);text-decoration:none;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.nav-link.active{color:white;border-bottom-color:#639922;}
.nav-link:hover{color:white;}
.nav-spacer{flex:1;}
.nav-add{background:var(--green-mid);color:white;border:none;border-radius:5px;padding:6px 14px;font-family:'Helvetica Neue',sans-serif;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.03em;}
.nav-add:hover{background:var(--green);}



/* SHELL */
.shell{flex:1;display:flex;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:320px;min-width:320px;background:var(--paper);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;}
.sb-top{padding:14px 16px;border-bottom:1px solid var(--rule);flex-shrink:0;}
.sb-filters{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:12px;border:1px solid var(--rule);background:white;cursor:pointer;color:var(--mid);transition:all .1s;}
.filter-btn.on{background:var(--green);color:white;border-color:var(--green);}
.sb-stats{display:flex;gap:14px;margin-top:10px;}
.stat-pill{font-family:'Helvetica Neue',sans-serif;font-size:11px;color:var(--mid);}
.stat-pill strong{color:var(--ink);}
.site-list{flex:1;overflow-y:auto;}

.site-row{padding:11px 14px;border-bottom:1px solid var(--rule);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s;}
.site-row:hover{background:var(--cream);}
.site-row.active{background:var(--green-light);}
.site-row.rejected{opacity:.5;}
.combined-badge{width:32px;height:32px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-family:'Helvetica Neue',sans-serif;}
.combined-badge .cb-num{font-size:13px;font-weight:700;line-height:1;}
.combined-badge .cb-den{font-size:8px;opacity:.55;line-height:1;margin-top:1px;}
.cb-5{background:var(--green-deep);color:white;border:1.5px solid var(--green-deep);}
.cb-4{background:var(--green-light);color:var(--green);border:1.5px solid var(--green);}
.cb-3{background:#F0F6E6;color:#4A7A1A;border:1.5px solid #4A7A1A;}
.cb-2{background:#FEF4E0;color:var(--amber);border:1.5px solid var(--amber);}
.cb-1{background:#FCEAEA;color:var(--red);border:1.5px solid var(--red);}
.cb-n{background:#F0EDE6;color:var(--mid);border:1.5px solid var(--rule);font-size:9px;}
.site-info{flex:1;min-width:0;}
.site-addr{font-family:'Helvetica Neue',sans-serif;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.site-sub{font-family:'Helvetica Neue',sans-serif;font-size:10px;color:var(--mid);margin-top:2px;display:flex;gap:6px;align-items:center;}
.score-pills{display:flex;gap:3px;}
.sp{font-family:'Helvetica Neue',sans-serif;font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.03em;}
.sp-m{background:#EAF0E2;color:var(--green);}
.sp-i{background:#E8F0FB;color:var(--blue);}
.sp-gray{background:#F0EDE6;color:var(--mid);}
.stage-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sd-0{background:#ccc;}
.sd-1{background:var(--amber);}
.sd-2{background:#639922;}
.sd-3{background:var(--blue);}
.sd-4{background:var(--green-deep);}
.sd-r{background:var(--red);}

/* DETAIL */
.detail{flex:1;overflow-y:auto;background:var(--cream);}
.detail-empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mid);}
.detail-empty .arrow{font-size:24px;opacity:.3;}
.detail-empty p{font-family:'Helvetica Neue',sans-serif;font-size:12px;}

/* DETAIL HEADER */
.dh{padding:20px 24px 0;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.dh-title{font-family:'Helvetica Neue',sans-serif;font-size:18px;font-weight:700;flex:1;min-width:200px;}
.dh-badge{font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:12px;}
.badge-active{background:var(--green-light);color:var(--green);}
.badge-rejected{background:#FCEAEA;color:var(--red);}
.badge-accepted{background:#E8F0FB;color:var(--blue);}
.dh-actions{display:flex;gap:6px;flex-wrap:wrap;}
.btn-sm{font-family:'Helvetica Neue',sans-serif;font-size:11px;font-weight:600;padding:6px 12px;border-radius:5px;border:none;cursor:pointer;white-space:nowrap;}
.btn-primary{background:var(--green);color:white;}
.btn-primary:hover{background:var(--green-mid);}
.btn-secondary{background:white;color:var(--ink);border:1px solid var(--rule);}
.btn-secondary:hover{background:var(--cream);}
.btn-danger{background:#FCEAEA;color:var(--red);border:1px solid #F0CACA;}
.btn-danger:hover{background:#F8D7D7;}
.btn-sm:disabled{opacity:.4;cursor:not-allowed;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--rule);padding:0 24px;background:var(--paper);margin-bottom:0;flex-shrink:0;}
.tab{font-family:'Helvetica Neue',sans-serif;font-size:11px;font-weight:600;letter-spacing:.05em;padding:12px 14px;cursor:pointer;color:var(--mid);border-bottom:2px solid transparent;transition:all .15s;}
.tab.active{color:var(--green);border-bottom-color:var(--green);}

/* TAB PANELS */
.tab-panel{display:none;padding:20px 24px 40px;}
.tab-panel.active{display:block;}

/* CARDS */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:14px;}
.card-title{font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title-tag{background:var(--green-light);color:var(--green);font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:3px;}

/* COMBINED SCORE HERO */
.score-hero{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;gap:18px;}
.score-dials{display:flex;gap:12px;flex-shrink:0;}
.dial{width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dial-num{font-family:'Helvetica Neue',sans-serif;font-size:20px;font-weight:700;line-height:1;}
.dial-lbl{font-family:'Helvetica Neue',sans-serif;font-size:8px;opacity:.55;margin-top:2px;text-transform:uppercase;letter-spacing:.05em;}
.dial-den{font-family:'Helvetica Neue',sans-serif;font-size:9px;opacity:.45;margin-top:1px;}
.d1{background:#FCEAEA;color:var(--red);border:2px solid var(--red);}
.d2{background:#FEF4E0;color:var(--amber);border:2px solid var(--amber);}
.d3{background:#F0F6E6;color:#4A7A1A;border:2px solid #4A7A1A;}
.d4{background:var(--green-light);color:var(--green);border:2px solid var(--green);}
.d5{background:var(--green-deep);color:white;border:2px solid var(--green-deep);}
.dn{background:#F0EDE6;color:var(--mid);border:2px solid var(--rule);}
.score-combined{flex:1;}
.sc-label{font-family:'Helvetica Neue',sans-serif;font-size:16px;font-weight:700;margin-bottom:4px;}
.sc-sub{font-family:'Helvetica Neue',sans-serif;font-size:11px;color:var(--mid);}

/* SCORE SECTIONS */
.score-section{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:14px;}
.ss-header{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule);background:var(--cream);}
.ss-dial{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Helvetica Neue',sans-serif;font-size:15px;font-weight:700;flex-shrink:0;}
.ss-info{flex:1;}
.ss-title{font-family:'Helvetica Neue',sans-serif;font-size:13px;font-weight:600;}
.ss-sub{font-family:'Helvetica Neue',sans-serif;font-size:11px;color:var(--mid);margin-top:2px;}
.ss-body{padding:14px 18px;}
.ss-reasoning{font-size:13px;line-height:1.7;color:var(--ink);}
.ss-run-btn{font-family:'Helvetica Neue',sans-serif;font-size:11px;font-weight:600;padding:7px 14px;border-radius:5px;border:none;cursor:pointer;background:var(--green);color:white;white-space:nowrap;flex-shrink:0;}
.ss-run-btn:hover{background:var(--green-mid);}
.ss-run-btn:disabled{opacity:.4;cursor:not-allowed;}

/* SIGNAL BREAKDOWN */
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.sig-card{background:var(--cream);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;}
.sig-label{font-family:'Helvetica Neue',sans-serif;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:5px;}
.sig-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;font-family:'Helvetica Neue',sans-serif;font-size:11px;}
.sig-name{color:var(--mid);}
.sig-val{font-weight:600;}
.delta{font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;margin-left:3px;}
.dpos{background:#E5F3D0;color:var(--green);}
.dneg{background:#FDECEA;color:var(--red);}
.dneu{background:#F0EDE6;color:var(--mid);}
.sig-bar{height:3px;background:#EDE9E0;border-radius:2px;overflow:hidden;margin-top:3px;}
.sig-bar-fill{height:100%;border-radius:2px;background:var(--green-mid);}
.sig-bar-fill.amber{background:var(--amber);}
.sig-bar-fill.red{background:var(--red);}

/* VENUES */
.venue-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);font-family:'Helvetica Neue',sans-serif;font-size:11px;}
.venue-row:last-child{border-bottom:none;}
.vtag{font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:3px;flex-shrink:0;}
.vtag-pos{background:#E5F3D0;color:#2A6010;}
.vtag-neg{background:#FDECEA;color:var(--red);}
.vtag-neu{background:#F0EDE6;color:var(--mid);}
.vname{flex:1;font-weight:500;}
.vtype{color:var(--mid);}
.vrev{color:var(--mid);text-align:right;white-space:nowrap;}

/* FIELDS */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-group{display:flex;flex-direction:column;gap:2px;}
.fl{font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mid);}
.fv{font-family:'Helvetica Neue',sans-serif;font-size:13px;color:var(--ink);}
.fv input,.fv select{width:100%;padding:7px 10px;border:1px solid var(--rule);border-radius:5px;font-family:'Helvetica Neue',sans-serif;font-size:12px;background:var(--cream);outline:none;}
.fv input:focus,.fv select:focus{border-color:var(--green-mid);background:white;}

/* PROGRESS */
.progress-steps{display:flex;flex-direction:column;gap:0;}
.prog-step{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--paper);border:1px solid var(--rule);font-family:'Helvetica Neue',sans-serif;font-size:11px;color:var(--mid);}
.prog-step:first-child{border-radius:6px 6px 0 0;}
.prog-step:last-child{border-radius:0 0 6px 6px;}
.prog-step+.prog-step{border-top:none;}
.prog-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.pw{background:#F0EDE6;color:var(--mid);}
.pr{background:#FEF4E0;color:var(--amber);animation:pulse 1s ease-in-out infinite;}
.pd{background:var(--green-light);color:var(--green);}
.pe{background:#FCEAEA;color:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--paper);border-radius:10px;width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-family:'Helvetica Neue',sans-serif;font-size:14px;font-weight:600;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--mid);padding:0 4px;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;}
.mf-input{width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Helvetica Neue',sans-serif;font-size:13px;background:var(--cream);outline:none;margin-bottom:12px;}
.mf-input:focus{border-color:var(--green-mid);background:white;}
.mf-label{font-family:'Helvetica Neue',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);display:block;margin-bottom:4px;}

/* LOADING OVERLAY */
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

const WEIGHTS={professionals:0.35,age_30_44:0.15,age_16_29:0.10,deprivation:0.25,private_rent:0.10,social_rent:0.05};
const THRESHOLDS=[[1.10,1.00],[0.90,0.80],[0.75,0.55],[0.55,0.30],[0.00,0.05]];

async function patchSite(id,patch){

// ── SCORING HELPERS ───────────────────────────────────────────────────────
function getSigScore(ratio){for(const[t,s]of THRESHOLDS){if(ratio>=t)return s;}return 0.05;}
function macroW(s){
  const vals={professionals:s.professionals,age_30_44:s.age_30_44,age_16_29:s.age_16_29,
    private_rent:s.private_rent,social_rent:s.social_rent,deprivation:s.deprivation};
  let W=0;
  for(const[k,w]of Object.entries(WEIGHTS)){
    const v=vals[k];if(v==null)continue;
    const bench=BENCH[k];
    const ratio=k==='social_rent'?(bench/Math.max(v,0.1)):(v/bench);
    W+=w*getSigScore(ratio);
  }
  return W;
}
function wToScore5(W){return Math.min(5,Math.max(1,Math.round(1+W*4)));}

function combinedScore(s){
  const m=s.macro_score_v2;
  const i=s.micro_score_v2;
  if(m!=null&&i!=null)return((+m+ +i)/2).toFixed(1);
  if(m!=null)return(+m).toFixed(1);
  if(i!=null)return(+i).toFixed(1);
  // Fall back to old scores (1-4 scale, convert to 1-5)
  const old=[];
  if(s.macro_ai_score!=null)old.push((+s.macro_ai_score/4)*5);
  if(s.micro_ai_score!=null)old.push((+s.micro_ai_score/4)*5);
  if(old.length)return(old.reduce((a,b)=>a+b)/old.length).toFixed(1);
  return null;
}

function scoreClass(v){
  if(v==null)return'cb-n';
  const n=parseFloat(v);
  if(n>=4.5)return'cb-5';if(n>=3.5)return'cb-4';if(n>=2.5)return'cb-3';if(n>=1.5)return'cb-2';return'cb-1';
}
function dialClass(v){
  if(v==null)return'dn';
  const n=parseInt(v);
  return['','d1','d2','d3','d4','d5'][Math.min(5,Math.max(1,n))]||'dn';
}
const SCORE_LABELS=['','Very poor','Poor match','Moderate','Good match','Strong match'];
const COMBINED_LABELS={5:'Strong match',4:'Good match',3:'Moderate match',2:'Weak match',1:'Poor match'};

// ── RENDER HELPERS ────────────────────────────────────────────────────────
function fR(v){return'£'+Number(v).toLocaleString('en-GB')+' p.a.';}
function fD(v){if(!v)return'—';const d=new Date(v);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}

function stageBadge(s){
  if(s.status==='rejected')return{cls:'badge-rejected',lbl:'Rejected'};
  if(s.status==='accepted')return{cls:'badge-accepted',lbl:'Accepted'};
  const stages=['Triage','Appraisal','Scoring','Under offer','Active'];
  return{cls:'badge-active',lbl:stages[Math.min(4,s.stage||0)]||'Active'};
}

function stageDot(s){
  if(s.status==='rejected')return'sd-r';
  return['sd-0','sd-1','sd-2','sd-3','sd-4'][Math.min(4,s.stage||0)];
}

// ── STATS ─────────────────────────────────────────────────────────────────
function renderStats(){
  const active=sites.filter(x=>x.status!=='rejected').length;

     <span class="stat-pill"><strong>${active}</strong> active</span>

}

// ── FILTER ────────────────────────────────────────────────────────────────
function setFilter(f){
  curFilter=f;
  ['all','active','scored','rejected'].forEach(k=>{
    document.getElementById('f-'+k).classList.toggle('on',k===f);
  });
  renderList();
}

function filteredSites(){
  let s=[...sites];
  if(curFilter==='active')s=s.filter(x=>x.status!=='rejected');
  else if(curFilter==='rejected')s=s.filter(x=>x.status==='rejected');
  else if(curFilter==='scored')s=s.filter(x=>combinedScore(x)!=null);
  s.sort((a,b)=>{
    const ca=combinedScore(a),cb=combinedScore(b);
    if(ca&&cb)return parseFloat(cb)-parseFloat(ca);
    if(ca)return-1;if(cb)return 1;
    return new Date(b.submitted_at)-new Date(a.submitted_at);
  });
  return s;
}

// ── SITE LIST ─────────────────────────────────────────────────────────────
function renderList(){

function renderMacroTab(s){
  const el=document.getElementById('macro-content');

  let html=`<div class="score-section" style="margin-bottom:14px">

      <div class="ss-dial ${hasScore?dialClass(s.macro_score_v2):'dn'}">${s.macro_score_v2||'—'}</div>

        <div class="ss-sub">Benchmarked against Balham + Wandsworth. Postcode auto-extracted from address.</div>
      </div>
      <button class="btn-sm btn-primary ss-run-btn" id="macro-run-btn" onclick="runMacroScore()">

    ${hasScore?renderMacroBreakdown(s):'<div class="ss-body" style="color:var(--mid);font-family:\'Helvetica Neue\',sans-serif;font-size:12px;">Enter a postcode below and click Run score.</div>'}
  </div>

function renderMacroBreakdown(s){
  if(!s.macro_score_data)return`<div class="ss-body"><div class="ss-reasoning">${s.macro_score_v2_reasoning||s.macro_ai_reasoning||''}</div></div>`;
  let d=s.macro_score_data;
  if(typeof d==='string')try{d=JSON.parse(d);}catch(e){return'';}

  const signals=[
    {key:'professionals',label:'Professionals',sfx:'%'},
    {key:'age_30_44',label:'Age 30–44',sfx:'%'},
    {key:'age_16_29',label:'Age 16–29',sfx:'%'},
    {key:'deprivation',label:'Deprivation',sfx:'/10'},
    {key:'private_rent',label:'Private rent',sfx:'%'},
    {key:'social_rent',label:'Social rent',sfx:'%'},
  ];

  const sigHtml=signals.map(sig=>{
    const val=d[sig.key];const bench=BENCH[sig.key];
    if(val==null)return'';
    const hi=sig.key!=='social_rent';
    const ratio=hi?(val/bench):(bench/Math.max(val,0.1));
    const delta=val-bench;
    const dCls=Math.abs(delta)<bench*0.08?'dneu':((hi?delta>0:delta<0)?'dpos':'dneg');
    const sign=delta>0?'+':'';
    const pct=Math.min(100,(val/Math.max(bench*1.15,val))*100);
    const barCls=ratio>=0.90?'':(ratio>=0.75?'amber':'red');
    return`<div class="sig-card">
      <div class="sig-label">${sig.label}</div>
      <div class="sig-row"><span class="sig-name">Site</span><span class="sig-val">${val.toFixed(1)}${sig.sfx}<span class="delta ${dCls}">${sign}${delta.toFixed(1)}${sig.sfx}</span></span></div>
      <div class="sig-row"><span class="sig-name">Benchmark</span><span class="sig-val" style="color:var(--mid)">${bench}${sig.sfx}</span></div>
      <div class="sig-bar"><div class="sig-bar-fill ${barCls}" style="width:${pct.toFixed(0)}%"></div></div>
    </div>`;
  }).join('');

  return`<div class="ss-body">
    ${s.macro_score_v2_reasoning?`<div class="ss-reasoning" style="margin-bottom:12px">${s.macro_score_v2_reasoning}</div>`:''}
    <div class="sig-grid">${sigHtml}</div>
  </div>`;
}

function extractPostcode(address){
  if(!address)return null;
  const m=address.toUpperCase().match(/([A-Z]{1,2}\d{1,2}[A-Z]?)\s*(\d[A-Z]{2})/);
  return m?`${m[1]} ${m[2]}`:null;
}

async function runMacroScore(){
  const s=sites.find(x=>x.id===curId);if(!s)return;
  const pc=extractPostcode(s.address);
  if(!pc){alert('No valid UK postcode found in this address. Edit the address in Site Info to include one.');return;}

  const btn=document.getElementById('macro-run-btn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Running…';
  const prog=document.getElementById('macro-progress');
  prog.style.display='block';

  function setStep(n,state,msg){
    const steps=['Fetching demographics','Fetching deprivation','Computing score'];
    prog.innerHTML=steps.map((lbl,i)=>{
      const cls=i<n?'pd':i===n?state:' pw';
      const dot=i<n?'✓':i===n&&state==='pe'?'✗':(i+1);
      return`<div class="prog-step"><div class="prog-dot ${cls}">${dot}</div><span>${lbl}${i===n?' — '+msg:''}</span></div>`;
    }).join('');
  }

  try {
    setStep(0,'pr','Calling Homedata…');
    const encPc=encodeURIComponent(pc);
    const [demRes,depRes]=await Promise.all([
      fetch(`https://api.homedata.co.uk/api/demographics/?postcode=${encPc}`,{headers:{'Authorization':'Api-Key '+HOMEDATA_KEY}}),
      fetch(`https://api.homedata.co.uk/api/deprivation/?postcode=${encPc}`,{headers:{'Authorization':'Api-Key '+HOMEDATA_KEY}})
    ]);
    const dem=await demRes.json();
    const dep=await depRes.json();
    if(dem.error)throw new Error(dem.error.message||'Postcode not found in Homedata');

    setStep(1,'pd','');setStep(1,'pr','Computing…');

    const prof=parseFloat((dem.occupation||{}).managerial_professional_pct||0);
    const age30=parseFloat((dem.age||{}).age_30_44_pct||0);
    const age16=parseFloat((dem.age||{}).age_16_29_pct||0);
    const pRent=parseFloat((dem.tenure||{}).private_rented_pct||0);
    const sRent=parseFloat((dem.tenure||{}).social_rented_pct||0);
    const depSc=parseFloat(((dep.overall)||{}).score||BENCH.deprivation);

    const data={professionals:prof,age_30_44:age30,age_16_29:age16,private_rent:pRent,social_rent:sRent,deprivation:depSc};
    const W=macroW(data);
    const score=wToScore5(W);
    const reasoning=buildMacroReasoning(data,score);

    setStep(2,'pd','Score '+score+'/5');
    prog.style.display='none';

    await patchSite(curId,{
      macro_score_v2:score,
      macro_score_v2_reasoning:reasoning,
      macro_score_data:JSON.stringify(data)
    });

    renderDetail(sites.find(x=>x.id===curId));
    renderList();
  } catch(e){
    setStep(0,'pe',e.message);
    btn.disabled=false;btn.textContent='Re-run';
  }
}

function buildMacroReasoning(d,score){
  const parts=[];
  if(d.professionals>=BENCH.professionals*0.9)parts.push(`Professional density (${d.professionals.toFixed(0)}%) is close to benchmark.`);
  else parts.push(`Professional density (${d.professionals.toFixed(0)}%) is below the ${BENCH.professionals.toFixed(0)}% benchmark.`);
  const youngPop=d.age_30_44+d.age_16_29;
  if(youngPop>=58)parts.push(`Strong 25–44 age concentration (${youngPop.toFixed(0)}% combined).`);
  else parts.push(`25–44 age proxy is ${youngPop.toFixed(0)}% — below benchmark.`);
  if(d.deprivation>=BENCH.deprivation*0.85)parts.push(`Deprivation score (${d.deprivation}/10) is consistent with your live sites.`);
  else parts.push(`Deprivation score (${d.deprivation}/10) is below benchmark — lower affluence signal.`);
  return parts.join(' ');
}

// Place classification
const LEISURE_TYPES=new Set(['gym','fitness_center','spa','beauty_salon','hair_care','nail_salon','cafe','coffee_shop','bar','restaurant','food','bakery','wine_bar','yoga','pilates','sports_club','clothing_store','shoe_store','jewelry_store','book_store','supermarket','grocery_or_supermarket','convenience_store','pharmacy','florist','pet_store','bicycle_store','sporting_goods_store','art_gallery','museum','movie_theater']);
const NEGATIVE_TYPES=new Set(['car_repair','car_wash','car_dealer','gas_station','parking','storage','moving_company','general_contractor','roofing_contractor','laundry','funeral_home','cemetery','liquor_store','casino']);
const TYPE_LABELS={bar:'Bar',restaurant:'Restaurant',cafe:'Café',gym:'Gym',fitness_center:'Gym',spa:'Spa',beauty_salon:'Beauty salon',hair_care:'Hair salon',bakery:'Bakery',clothing_store:'Clothing',shoe_store:'Shoes',book_store:'Bookshop',supermarket:'Supermarket',grocery_or_supermarket:'Supermarket',convenience_store:'Convenience',pharmacy:'Pharmacy',art_gallery:'Gallery',museum:'Museum',movie_theater:'Cinema',health:'Health/wellness',car_repair:'Car repair',general_contractor:'Contractor',gas_station:'Petrol station',point_of_interest:'Business',store:'Shop',establishment:'Business'};

function classifyPlace(types){const t=new Set(types);if([...t].some(x=>NEGATIVE_TYPES.has(x)))return'neg';if([...t].some(x=>LEISURE_TYPES.has(x)))return'pos';return'neu';}
function primaryType(types){for(const t of types){if(TYPE_LABELS[t]&&t!=='point_of_interest'&&t!=='establishment'&&t!=='store')return TYPE_LABELS[t];}return TYPE_LABELS[types[0]]||types[0]||'Business';}

function volScore(places){
  const total=places.reduce((s,p)=>s+(p.user_ratings_total||0),0);
  if(total>=15000)return 5;if(total>=8000)return 4;if(total>=3000)return 3;if(total>=1000)return 2;return 1;
}
function intentScore(places){
  const active=places.filter(p=>(p.user_ratings_total||0)>0);
  if(!active.length)return 1;
  const posR=active.filter(p=>classifyPlace(p.types)==='pos').reduce((s,p)=>s+(p.user_ratings_total||0),0);
  const negR=active.filter(p=>classifyPlace(p.types)==='neg').reduce((s,p)=>s+(p.user_ratings_total||0),0);
  const totR=active.reduce((s,p)=>s+(p.user_ratings_total||0),0);
  const adj=(posR/Math.max(totR,1))-(negR/Math.max(totR,1))*0.5;
  if(adj>=0.65)return 5;if(adj>=0.45)return 4;if(adj>=0.28)return 3;if(adj>=0.12)return 2;return 1;
}

        <div class="card-title">Nearby venues — 400m radius <span style="float:right;font-weight:400">${d.places.length} total</span></div>

          <span class="vtype">${primaryType(p.types)}</span>
          <span class="vrev">${(p.user_ratings_total||0).toLocaleString()} reviews${p.rating?' · '+p.rating+'★':''}</span>
        </div>`}).join('')}

    }
  }

  el.innerHTML=`<div class="score-section" style="margin-bottom:14px">
    <div class="ss-header">
      <div class="ss-dial ${hasScore?dialClass(s.micro_score_v2):'dn'}">${s.micro_score_v2||'—'}</div>
      <div class="ss-info">
        <div class="ss-title">Micro Score — Footfall & street character</div>
        <div class="ss-sub">Google Places (400m) · Claude street assessment. Weights: volume 30% · intent 35% · character 35%</div>
      </div>
      <button class="btn-sm btn-primary ss-run-btn" id="micro-run-btn" onclick="runMicroScore()">${hasScore?'Re-run':'Run score'}</button>
    </div>
    <div id="micro-progress" style="display:none;padding:12px 18px;"></div>
    ${hasScore&&s.micro_score_v2_reasoning?`<div class="ss-body">
      <div class="ss-reasoning">${s.micro_score_v2_reasoning}</div>
      ${s.micro_score_data?renderMicroComponents(s):''}
    </div>`:'<div class="ss-body" style="color:var(--mid);font-family:\'Helvetica Neue\',sans-serif;font-size:12px;">Address is geocoded automatically. Click Run score to pull nearby venues and assess street character.</div>'}
  </div>${venueHtml}`;
}

  let d=s.micro_score_data;if(typeof d==='string')try{d=JSON.parse(d);}catch(e){return'';}
  if(!d.vol_score)return'';
  return`<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
    <div style="background:var(--cream);border:1px solid var(--rule);border-radius:6px;padding:10px 14px;flex:1;min-width:100px">
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:4px">Volume</div>
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:20px;font-weight:700;color:var(--green)">${d.vol_score}<span style="font-size:11px;opacity:.5">/5</span></div>
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:10px;color:var(--mid)">${(d.total_reviews||0).toLocaleString()} reviews · 30%</div>
    </div>
    <div style="background:var(--cream);border:1px solid var(--rule);border-radius:6px;padding:10px 14px;flex:1;min-width:100px">
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:4px">Intent</div>
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:20px;font-weight:700;color:var(--green)">${d.intent_score}<span style="font-size:11px;opacity:.5">/5</span></div>
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:10px;color:var(--mid)">${d.pos_count||0} positive venues · 35%</div>
    </div>
    <div style="background:var(--cream);border:1px solid var(--rule);border-radius:6px;padding:10px 14px;flex:1;min-width:100px">
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:4px">Character</div>
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:20px;font-weight:700;color:var(--green)">${d.ai_score}<span style="font-size:11px;opacity:.5">/5</span></div>
      <div style="font-family:'Helvetica Neue',sans-serif;font-size:10px;color:var(--mid)">Claude assessment · 35%</div>
    </div>
  </div>`;
}

async function runMicroScore(){
  const s=sites.find(x=>x.id===curId);if(!s)return;
  const btn=document.getElementById('micro-run-btn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Running…';
  const prog=document.getElementById('micro-progress');
  prog.style.display='block';

  function setStep(n,state,msg){
    const labels=['Locating address','Pulling nearby venues','Assessing street character'];
    prog.innerHTML=labels.map((lbl,i)=>{
      const cls=i<n?'pd':i===n?state:'pw';
      const dot=i<n?'✓':i===n&&state==='pe'?'✗':(i+1);
      return`<div class="prog-step"><div class="prog-dot ${cls}">${dot}</div><span>${lbl}${i===n&&msg?' — '+msg:''}</span></div>`;
    }).join('');
  }

  try {
    // Step 1: Geocode
    setStep(0,'pr','');
    const geoRes=await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(s.address)}&region=gb&key=${GOOGLE_KEY}`);
    const geoData=await geoRes.json();
    if(geoData.status!=='OK'||!geoData.results.length)throw new Error('Address not found');
    const {lat,lng}=geoData.results[0].geometry.location;
    const formatted=geoData.results[0].formatted_address;
    setStep(0,'pd',formatted);

    // Step 2: Places
    setStep(1,'pr','');
    const placesRes=await fetch('https://places.googleapis.com/v1/places:searchNearby',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Goog-Api-Key':GOOGLE_KEY,'X-Goog-FieldMask':'places.displayName,places.types,places.rating,places.userRatingCount'},
      body:JSON.stringify({locationRestriction:{circle:{center:{latitude:lat,longitude:lng},radius:400.0}},maxResultCount:20})
    });
    const placesData=await placesRes.json();
    const places=(placesData.places||[]).map(p=>({
      name:p.displayName?.text||'',
      types:p.types||(p.primaryType?[p.primaryType]:['establishment']),
      rating:p.rating||null,
      user_ratings_total:p.userRatingCount||0
    }));
    const totalRev=places.reduce((s,p)=>s+(p.user_ratings_total||0),0);
    const posCount=places.filter(p=>classifyPlace(p.types)==='pos').length;
    setStep(1,'pd',`${places.length} venues · ${totalRev.toLocaleString()} reviews · ${posCount} positive`);

    const vScore=volScore(places);
    const iScore=intentScore(places);

    // Step 3: AI
    setStep(2,'pr','');
    const posVenues=places.filter(p=>classifyPlace(p.types)==='pos').sort((a,b)=>(b.user_ratings_total||0)-(a.user_ratings_total||0)).slice(0,8).map(p=>`${p.name} (${primaryType(p.types)}, ${p.user_ratings_total||0} reviews)`);
    const negVenues=places.filter(p=>classifyPlace(p.types)==='neg').map(p=>p.name);

    const prompt=`Score this London location for Scratch Golf Club — an unstaffed indoor golf simulator targeting 30-34 year old professionals. 41% of members found it by walking past.

Address: ${formatted}

Nearby venues (positive signals): ${posVenues.length?posVenues.join(', '):'None'}
Nearby venues (negative signals): ${negVenues.length?negVenues.join(', '):'None'}

Score 1-5 on street character and discovery potential:
1=hidden/wrong crowd/dead evenings 2=low visibility/limited passing trade 3=some passing trade from target demographic 4=natural through-route/active evenings/good visibility 5=high visibility on route locals use daily/strong leisure scene/evening-active

Reply ONLY with JSON: {"score":3,"reasoning":"2-3 sentences on street character, evening activity, and discovery potential for a golf simulator"}`;

    const aiRes=await fetch(EDGE_FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({prompt})});
    const aiRaw=await aiRes.text();
    if(!aiRaw)throw new Error('Empty response from AI proxy');
    const aiData=JSON.parse(aiRaw);
    if(aiData.error)throw new Error(JSON.stringify(aiData.error));
    if(typeof aiData.score==='undefined')throw new Error('No score returned');
    const aiScore=Math.min(5,Math.max(1,Math.round(parseFloat(aiData.score))));

    setStep(2,'pd','Score '+aiScore+'/5');
    prog.style.display='none';

    const microScore=Math.min(5,Math.max(1,Math.round((vScore*0.30)+(iScore*0.35)+(aiScore*0.35))));

    const microData={vol_score:vScore,intent_score:iScore,ai_score:aiScore,total_reviews:totalRev,pos_count:posCount,places};

    await patchSite(curId,{
      micro_score_v2:microScore,
      micro_score_v2_reasoning:aiData.reasoning||'',
      micro_score_data:JSON.stringify(microData),
      lat,lng
    });

    renderDetail(sites.find(x=>x.id===curId));
    renderList();
  } catch(e){
    setStep(2,'pe',e.message);
    btn.disabled=false;btn.textContent='Re-run';
  }
}

async function saveInfo(){
  const patch={
    sqft:document.getElementById('inf-sqft').value||null,
    rent:document.getElementById('inf-rent').value||null,
    service_charge:document.getElementById('inf-sc').value!==''?parseFloat(document.getElementById('inf-sc').value):null,
    expected_bays:document.getElementById('inf-bays').value||null,
    ceiling_ok:document.getElementById('inf-ceil').value==='true',
    agent_name:document.getElementById('inf-agent').value||null,
    agency_name:document.getElementById('inf-agency').value||null,
    notes:document.getElementById('inf-notes').value||null,
  };
  await patchSite(curId,patch);
  renderDetail(sites.find(x=>x.id===curId));
}

// ── TABS ──────────────────────────────────────────────────────────────────
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    const tabs=['overview','macro','micro','info'];
    el.classList.toggle('active',tabs[i]===t);
  });
  document.querySelectorAll('.tab-panel').forEach(el=>{
    el.classList.toggle('active',el.id==='tab-'+t);
  });
}

// ── STAGE / STATUS ────────────────────────────────────────────────────────
async function advanceStage(){
  const s=sites.find(x=>x.id===curId);if(!s)return;
  const st=s.stage||0;
  await patchSite(curId,{stage:Math.min(4,st+1),status:'active'});
  renderDetail(sites.find(x=>x.id===curId));
  renderList();
}

async function rejectSite(){
  if(!confirm('Reject this site?'))return;
  await patchSite(curId,{status:'rejected'});
  renderDetail(sites.find(x=>x.id===curId));
  renderList();renderStats();
}

async function reinstateeSite(){
  await patchSite(curId,{status:'active',rejection_reason:null});
  renderDetail(sites.find(x=>x.id===curId));
  renderList();renderStats();
}

// ── ADD SITE ──────────────────────────────────────────────────────────────
function openAddModal(){document.getElementById('add-modal').classList.add('open');}
function closeAddModal(){document.getElementById('add-modal').classList.remove('open');}

async function addSite(){
  const addr=document.getElementById('add-addr').value.trim();
  if(!addr){alert('Address required.');return;}
  const btn=document.getElementById('add-btn');
  btn.disabled=true;btn.textContent='Adding…';
  const r=await db.from('sites').insert({
    address:addr,
    agent_name:document.getElementById('add-agent').value.trim()||null,
    agency_name:document.getElementById('add-agency').value.trim()||null,
    notes:document.getElementById('add-notes').value.trim()||null,
    stage:0,status:'active',ceiling_ok:false
  }).select();
  btn.disabled=false;btn.textContent='Add site';
  if(r.error){alert('Error: '+r.error.message);return;}
  closeAddModal();
  document.getElementById('add-addr').value='';
  document.getElementById('add-agent').value='';
  document.getElementById('add-agency').value='';
  document.getElementById('add-notes').value='';
  await loadSites();
  if(r.data&&r.data[0])selectSite(r.data[0].id);
}
